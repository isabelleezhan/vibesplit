services:
  postgres:
    image: postgres:16
    container_name: vibesplit-postgres
    environment:
      POSTGRES_USER: vibesplit
      POSTGRES_PASSWORD: vibesplit
      POSTGRES_DB: vibesplit
    ports:
      # 5433 on the host so it can run alongside other local Postgres containers.
      - "5433:5432"
    volumes:
      - vibesplit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibesplit"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Job queue for split jobs (app/worker.py). Run the worker with:
  #   arq app.worker.WorkerSettings
  redis:
    image: redis:7
    container_name: vibesplit-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vibesplit_pgdata:
